<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Horror Stories — London Transformation Map</title>
  <style>
    :root { --ink:#eaf4f5; --muted:#a7c2c6; --paper:#f7e9cf; --road:#21455d; --river:#78c8dc; --coral:#ec7663; --gold:#f4b848; --teal:#b8ebad; --complete:#244f77; --locked:#a9aaa3; --night:#07151d; }
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:#07151d;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 5%,#1e6575aa 0,transparent 29%),linear-gradient(135deg,#07151d,#0c2730 60%,#0b1d28);z-index:-2}
    .app{max-width:1440px;margin:auto;padding:26px 28px 32px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}.eyebrow{margin:0 0 6px;color:var(--gold);font-size:.72rem;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.topbar h1{margin:0;font-size:clamp(1.65rem,3vw,2.75rem);letter-spacing:-.055em;line-height:1}.topbar h1 span{color:var(--coral)}.instructions{max-width:360px;margin:4px 0 0;color:var(--muted);font-size:.9rem;line-height:1.5;text-align:right}
    .scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.score{border:1px solid #5b7c814d;background:#0d2028c9;padding:13px 15px;border-radius:14px;box-shadow:0 12px 30px #0003}.score-label{display:flex;justify-content:space-between;color:var(--muted);font-size:.74rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.score-value{font-size:1.28rem;color:#fff;font-weight:800}.meter{height:7px;background:#ffffff1b;border-radius:99px;margin-top:9px;overflow:hidden}.meter i{display:block;height:100%;width:0;border-radius:inherit;transition:width .5s ease;background:var(--gold)}.meter i.good{background:#61c978}.meter i.bad{background:var(--coral)}.meter i.neutral{background:var(--gold)}
    .map-shell{position:relative;width:min(100%,900px);aspect-ratio:1;min-height:0;margin-inline:auto;border:6px solid #fff8e8;border-radius:24px;overflow:hidden;background:#fbfaf5 url("assets/london-journey-map.svg") center/cover no-repeat;box-shadow:0 25px 70px #0007}.map-shell:after{content:"";inset:0;position:absolute;pointer-events:none;background:linear-gradient(180deg,#ffffff0c,transparent 22%,#0c273014);z-index:1}.route{position:absolute;inset:0;z-index:3;pointer-events:none}.route svg{width:100%;height:100%;overflow:visible}.route path{fill:none;stroke:#21455d;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 16;opacity:.55}
    dialog{border:0;padding:0;color:var(--ink);background:transparent;width:min(680px,calc(100% - 30px));max-height:90vh}dialog::backdrop{background:#031016d9;backdrop-filter:blur(7px)}.modal{position:relative;overflow:auto;max-height:90vh;border:1px solid #749fa982;border-radius:22px;background:#0b2029;box-shadow:0 24px 80px #000}.modal-head{padding:28px 34px 20px;background:linear-gradient(115deg,#143a43,#0e2530)}.modal-kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:900;color:var(--gold)}.modal h2{margin:6px 38px 0 0;font-size:clamp(1.5rem,3vw,2.25rem);line-height:1.03;letter-spacing:-.045em}.close{position:absolute;right:20px;top:19px;border:0;background:#ffffff12;color:#fff;width:32px;height:32px;border-radius:50%;font-size:1.25rem;cursor:pointer}.modal-body{padding:23px 34px 32px}.question{font-family:Georgia,serif;font-size:1.25rem;line-height:1.35;margin:0 0 18px;color:#fff}.choices{display:grid;gap:11px}.choice{width:100%;border:1px solid #6e9da24d;border-radius:12px;padding:15px 17px;background:#ffffff08;color:#eaf4f5;text-align:left;font:inherit;font-weight:700;line-height:1.35;cursor:pointer;transition:.18s}.choice:hover{border-color:var(--gold);background:#f6bf5e15;transform:translateY(-2px)}.choice span{color:var(--gold);font-size:.72rem;letter-spacing:.11em;margin-right:8px}.outcome{display:none}.outcome.show{display:block}.outcome p{font-size:1.06rem;line-height:1.55;color:#e6eeee;white-space:pre-line}.impacts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:21px 0}.impact{padding:12px;border-radius:10px;background:#ffffff0b;text-align:center}.impact b{display:block;font-size:1.2rem}.impact span{font-size:.63rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.positive{color:var(--teal)}.negative{color:var(--coral)}.neutral{color:var(--gold)}.continue{border:0;border-radius:10px;background:var(--gold);color:#18232a;font:inherit;font-weight:900;padding:13px 18px;cursor:pointer;min-width:140px}.continue:hover{background:#ffcf79}.ending{padding:20px;border-radius:12px;background:#f0705f1c;border:1px solid #f0705f55;color:#ffe4df;font-weight:700;line-height:1.45}
    @keyframes pulse{50%{box-shadow:0 0 0 3px #21455d,0 0 0 18px #b8ebad00,0 7px 0 #70ad79}}@media(max-width:650px){.app{padding:18px 14px}.topbar{display:block}.instructions{text-align:left;margin-top:13px}.scoreboard{gap:7px}.score{padding:10px}.score-label{font-size:.57rem}.map-shell{min-height:0}.step{width:78px}.token{width:39px;height:39px;font-size:.9rem}.step-name{font-size:.5rem}.landmark{display:none}.map-key{display:none}.modal-head,.modal-body{padding-left:20px;padding-right:20px}.impacts{grid-template-columns:1fr}.road{opacity:.6}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div><p class="eyebrow">Seminar 1 · Horror Story Time</p><h1>How AI has <span>f**AI**led</span></h1></div><p class="instructions">Navigate the London transformation map. Decide how your AI journey unfolds—and live with the consequences.</p></header>
    <section class="scoreboard" aria-label="Programme score"><div class="score"><div class="score-label"><span>Security risk</span><span class="score-value" id="risk-value">0</span></div><div class="meter"><i id="risk-bar"></i></div></div><div class="score delay"><div class="score-label"><span>Project delay</span><span class="score-value" id="delay-value">0 wks</span></div><div class="meter"><i id="delay-bar"></i></div></div><div class="score happiness"><div class="score-label"><span>Board happiness</span><span class="score-value" id="happiness-value">0</span></div><div class="meter"><i id="happiness-bar"></i></div></div></section>
    <section class="map-shell" aria-label="London AI transformation board game map">
      <div class="route"><svg viewBox="0 0 1000 650" preserveAspectRatio="none"><path d="M310 332 L445 332 L140 291 L302 236 L500 254 L598 299 L779 283 L631 414 L725 493"/></svg></div>
      <div id="steps"></div><aside class="map-key"><i class="key-dot"></i> Current <i class="key-dot done"></i> Complete <i class="key-dot locked"></i> Locked</aside>
    </section>
  </main>
  <dialog id="dialog"><div class="modal"><button class="close" aria-label="Close window">×</button><div class="modal-head"><div class="modal-kicker" id="modal-kicker"></div><h2 id="modal-title"></h2></div><div class="modal-body" id="modal-body"></div></div></dialog>
  <script>
    const positions=[['32.1%','51.2%'],['44.4%','51.2%'],['13.2%','44.8%'],['30.2%','32.4%'],['50%','35.8%'],['59.8%','45.8%'],['77.9%','43.7%'],['63%','64.2%'],['72.5%','77.7%']];
    const initial={risk:0,delay:0,happiness:0}; let score={...initial}, steps=[], unlocked=0, completed=[];
    const $=s=>document.querySelector(s); const dialog=$('#dialog');
    fetch('steps.json')
      .then(response => { if (!response.ok) throw new Error(`Unable to load steps: ${response.status}`); return response.json(); })
      .then(data => { steps=data.steps; render(); })
      .catch(() => { $('#steps').innerHTML='<p style="padding:2rem;color:#172c32">Unable to load the journey data. Please serve this folder through a local web server.</p>'; });
    function render(){const host=$('#steps');host.innerHTML='';steps.forEach((step,i)=>{const btn=document.createElement('button');const isCompleted=completed.includes(i); const isCurrent=i===unlocked&&!isCompleted; btn.className='step '+(isCompleted?'completed':isCurrent?'current':'locked'); btn.disabled=!isCurrent;btn.style.setProperty('--x',positions[i][0]);btn.style.setProperty('--y',positions[i][1]);btn.innerHTML=`<span class="token">${i+1}</span><span class="step-name">${step.title}</span>`;btn.onclick=()=>openStep(i);host.append(btn)});updateScore()}
    function openStep(i){const step=steps[i];$('#modal-kicker').textContent=`Stop ${i+1} of 9 · ${step.landmark}`;$('#modal-title').textContent=step.title;const body=$('#modal-body'); if(step.type==='comment'){body.innerHTML=`<p class="question">A note from the journey</p><p style="line-height:1.6;color:#d8e5e6">${step.message}</p><button class="continue">Continue</button>`;body.querySelector('.continue').onclick=()=>advance(i); }else{body.innerHTML=`<p class="question">${step.question}</p><div class="choices"><button class="choice" data-option="option1"><span>Route A</span>${step.option1.response}</button><button class="choice" data-option="option2"><span>Route B</span>${step.option2.response}</button></div><div class="outcome"></div>`;body.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>choose(i,btn.dataset.option));}dialog.showModal()}
    function choose(i,key){const option=steps[i][key]; score.risk+=Number(option.security_risk_impact);score.delay+=Number(option.project_delay_impact);score.happiness+=Number(option.board_happiness_impact);const impacts=[['Security risk',Number(option.security_risk_impact),'risk'],['Project delay',Number(option.project_delay_impact),'delay'],['Board happiness',Number(option.board_happiness_impact),'happiness']];const format=n=>n>0?`+${n}`:String(n);const style=(n,type)=>type==='risk'?(n>0?'negative':n<0?'positive':'neutral'):(n>0?'positive':n<0?'negative':'neutral');const outcome=$('.outcome');$('.choices').style.display='none';outcome.classList.add('show');outcome.innerHTML=`<p>${option.outcome}</p><div class="impacts">${impacts.map(([l,n,t])=>`<div class="impact"><b class="${style(n,t)}">${format(n)}${t==='delay'?' wk':''}</b><span>${l}</span></div>`).join('')}</div>${option.game_over?'<div class="ending">The transformation ends here. Reset the map and make a different opening decision.</div><button class="continue" style="margin-top:18px">Restart journey</button>':'<button class="continue">Continue journey</button>'}`;outcome.querySelector('.continue').onclick=()=>option.game_over?restart():advance(i);updateScore()}
    function advance(i){completed.push(i);unlocked=Math.min(i+1,steps.length-1);dialog.close();render();if(i===steps.length-1)setTimeout(finale,250)}
    function finale(){openStep(8);const body=$('#modal-body');body.insertAdjacentHTML('beforeend',`<div class="ending" style="margin-top:20px">Journey complete. Your final map tells the story: <strong>${score.risk}% security risk</strong>, <strong>${score.delay} weeks of delay</strong>, and <strong>${score.happiness}% board happiness</strong>.</div><button class="continue" style="margin-top:18px">Play again</button>`);body.querySelectorAll('.continue').forEach(b=>b.onclick=restart)}
    function restart(){score={...initial};unlocked=0;completed=[];dialog.close();render()}
    function updateScore(){const metrics=[['risk',score.risk,1],['delay',score.delay,8],['happiness',score.happiness,1]];metrics.forEach(([name,value,scale])=>{const bar=$(`#${name}-bar`);bar.style.width=`${Math.min(Math.abs(value)*scale,100)}%`;bar.className=value===0?'neutral':((name==='risk'||name==='delay')?value<0:value>0)?'good':'bad'});$('#risk-value').textContent=score.risk;$('#delay-value').textContent=`${score.delay} wks`;$('#happiness-value').textContent=score.happiness}
    $('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
  </script>
</body>
</html>
